name: Desktop (Windows)

# The only build workflow. It builds the unsigned Windows NSIS installer for
# Vibe Crypto and uploads it, with SHA256SUMS.txt and a zip of win-unpacked,
# as a downloadable workflow artifact. Tests live in test.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# `npm ci` runs a security audit after installing and can block for minutes
# when the npm advisory endpoint is slow. CI only; local installs still audit.
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  package:
    name: Windows installer
    # GTK is extracted as a checksum-pinned archive rather than executed as a
    # legacy NSIS installer, so packaging can run on the current Windows image.
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Rebuild node-pty for Electron
        # The embedded terminal uses node-pty, a native module. Rebuild it
        # against the Electron ABI so the packaged app can load it.
        working-directory: desktop/electron
        run: npm run rebuild:native

      - name: Platform-neutral desktop tests
        working-directory: desktop/electron
        run: |
          npm run build
          node scripts/test-backend-resolution.mjs
          node scripts/test-locales.mjs
          node scripts/test-terminal.mjs

      - name: Verify dormant update rejection and recovery policy
        working-directory: desktop/electron
        run: npm run test:update-safety

      - name: Prepare verified Electron runtime
        working-directory: desktop/electron
        run: npm run prepare:electron

      - name: Verify encrypted credential storage
        working-directory: desktop/electron
        run: npm run smoke:credentials

      - name: Verify bounded native process adapter
        working-directory: desktop/electron
        shell: powershell
        run: .\scripts\test-process-utils.ps1

      - name: Assemble minimal Python runtime
        working-directory: desktop/electron
        shell: powershell
        run: .\scripts\build-backend.ps1 -BuildPython "${{ env.pythonLocation }}\python.exe" -Clean

      - name: Verify backend lifecycle
        working-directory: desktop/electron
        run: npm run smoke:lifecycle

      - name: Build NSIS installer
        working-directory: desktop/electron
        # runtime:win starts Windows PowerShell. Keep its parent in the same
        # edition: inheriting pwsh's module path through npm hid Get-FileHash
        # on windows-2025 even though the direct runtime build above succeeded.
        # build-review-installer.mjs writes release\SHA256SUMS.txt.
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run installer:win:review

      - name: Verify packaged startup and parent-death cleanup
        working-directory: desktop/electron
        shell: powershell
        run: |
          $env:VIBE_TRADING_DESKTOP_ELECTRON_EXECUTABLE = (
            Resolve-Path 'release\win-unpacked\Vibe Crypto.exe'
          ).Path
          node scripts/smoke-parent-death.mjs

      - name: Verify installer, record checksum and zip win-unpacked
        working-directory: desktop/electron
        shell: powershell
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'Vibe-Crypto-*-x64.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path 'release\win-unpacked\*' -DestinationPath 'release\Vibe-Crypto-win-unpacked-x64.zip' -Force
          "### Unsigned Windows build" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- File: ``$($installer.Name)``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Download it from this run's Artifacts section (vibe-crypto-windows)." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-crypto-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            desktop/electron/release/Vibe-Crypto-*-x64.exe
            desktop/electron/release/SHA256SUMS.txt
            desktop/electron/release/Vibe-Crypto-win-unpacked-x64.zip

      - name: Publish GitHub Release
        # Creates release v<desktop/electron package.json version> (and its tag)
        # the first time that version is built on main. Bump the version to
        # publish a new release; later pushes of the same version skip this.
        if: github.ref == 'refs/heads/main'
        working-directory: desktop/electron
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { "Release $tag already exists; skipping."; exit 0 }
          $installer = Get-ChildItem -LiteralPath release -Filter 'Vibe-Crypto-*-x64.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $notes = @"
          Vibe Crypto $tag for Windows x64.

          Install: download $($installer.Name) and run it. The installer is unsigned, so Windows SmartScreen may warn; choose More info, then Run anyway.
          Verify: compare the file's SHA-256 with SHA256SUMS.txt.
          "@
          gh release create $tag $installer.FullName release\SHA256SUMS.txt --target $env:GITHUB_SHA --title "Vibe Crypto $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
